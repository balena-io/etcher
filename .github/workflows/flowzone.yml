name: Flowzone
on:
  # Internal and fork PRs both run here; forks run without secrets.
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main, master]
  # Fork contributions are rebuilt and published from the push to the default branch after merge.
  push:
    branches: [main, master]
jobs:
  flowzone:
    name: Flowzone
    uses: product-os/flowzone/.github/workflows/flowzone.yml@master
    secrets: inherit
    with:
      custom_test_matrix: >
        {
          "os": [
            ["Ubuntu-22.04-x64-32core"],
            ["windows-2022"],
            ["macos-26-large"],
            ["macos-latest-xlarge"]
          ]
        }
      custom_publish_matrix: >
        {
          "os": [
            ["ubuntu-22.04"],
            ["windows-2022"],
            ["macos-26-large"],
            ["macos-latest-xlarge"]
          ]
        }
      restrict_custom_actions: false
      github_prerelease: true
      cloudflare_website: 'etcher'
